    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle at 50% 50%, #1a1926, #0a0a10);
            font-family: sans-serif;
            overflow-x: hidden;
            position: relative;
            padding: 2rem;
        }

        /* Starry background */
        .stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            box-shadow:
                10px 20px 1px rgba(255,255,255,0.3), 50px 80px 1px rgba(255,255,255,0.4),
                120px 300px 1px rgba(255,255,255,0.2), 400px 150px 1px rgba(255,255,255,0.5),
                800px 250px 1px rgba(255,255,255,0.3), 100px 600px 1px rgba(255,255,255,0.4),
                500px 800px 1px rgba(255,255,255,0.2), 250px 900px 1px rgba(255,255,255,0.5);
        }

        .page-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 3rem;
            position: relative;
            z-index: 2;
        }

        .page-title {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, #c084fc 0%, #a78bfa 25%, #60a5fa 50%, #34d399 75%, #a78bfa 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: title-shimmer 6s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 12px rgba(167, 139, 250, 0.3));
        }

        @keyframes title-shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* --- POWER TOGGLE --- */
        .power-toggle {
            margin-top: 1rem;
            padding: 0.5rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .power-toggle .power-icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            color: #10b981;
            transition: color 0.4s ease;
        }

        .power-toggle:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .power-toggle:active {
            transform: scale(0.95);
        }

        .power-toggle:focus-visible {
            outline: 2px solid #06b6d4;
            outline-offset: 4px;
        }

        .power-toggle.off {
            color: #6b7280;
            border-color: rgba(107, 114, 128, 0.15);
            box-shadow: none;
        }

        .power-toggle.off .power-icon {
            color: #6b7280;
        }

        .power-toggle.on {
            border-color: rgba(16, 185, 129, 0.25);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.08), inset 0 0 15px rgba(16, 185, 129, 0.04);
        }

        .power-toggle.is-loading { opacity: 0.6; cursor: wait; }
        .power-toggle.is-success { border-color: rgba(16, 185, 129, 0.5); box-shadow: 0 0 25px rgba(16, 185, 129, 0.2); }
        .power-toggle.is-error { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 25px rgba(239, 68, 68, 0.2); }
        .power-toggle.is-error .power-icon { color: #ef4444; }

        /* --- GRID --- */
        .grid-container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 1000px;
            width: 100%;
            justify-items: center;
        }

        @media (max-width: 900px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            body { padding: 1rem; }
            .grid-container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                margin-bottom: 2rem;
            }
            .page-title { font-size: 1.75rem; }
        }

        /* --- CARD (taller: 200px) --- */
        .card {
            width: 100%;
            height: 200px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            overflow: visible;
            transition: transform 0.2s ease, box-shadow 0.3s ease, border 0.2s ease;
            isolation: isolate;
        }

        .card:hover { transform: translateY(-5px) scale(1.02); z-index: 10; }
        .card:active { transform: scale(0.95); }

        [data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0.5;
            background: radial-gradient(circle at center, var(--glow) 0%, transparent 70%);
            filter: blur(18px);
            z-index: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .card:hover::before {
            opacity: 0.9;
            transform: scale(1.2);
            filter: blur(25px);
        }

        .card.active-selected {
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15), inset 0 0 20px rgba(255, 255, 255, 0.05);
            transform: translateY(-3px);
        }

        .icon-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: var(--glow);
            border-radius: inherit;
            overflow: hidden;
        }

        .card.is-loading { opacity: 0.7; cursor: wait; }
        .card.is-success::before { background: radial-gradient(circle at center, #10b981 0%, transparent 70%) !important; filter: blur(25px) !important; opacity: 1 !important; }
        .card.is-error::before { background: radial-gradient(circle at center, #ef4444 0%, transparent 70%) !important; filter: blur(25px) !important; opacity: 1 !important; }

        .variation-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            font-family: 'Courier New', Courier, monospace;
        }
        .variation-toast.active { animation: toastFade 1.2s forwards; }
        @keyframes toastFade {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        }

        /* =========================================
           BIGGER ANIMATIONS FOR 200px CARD
           ========================================= */

        /* 1. FIREFLIES – wider, taller orbit */
        .fireflies { position: relative; width: 110px; height: 110px; }
        .firefly-main { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: currentColor; top: 50%; left: 50%; transform: translate(-50%, -50%); filter: blur(2px); box-shadow: 0 0 25px currentColor; animation: pulse-glow 2.5s ease-in-out infinite alternate; }
        .firefly-orb { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 12px currentColor; }
        .firefly-orb:nth-child(2) { top: 5px; left: 50%; transform: translateX(-50%); animation: orbit-ccw 4s linear infinite; }
        .firefly-orb:nth-child(3) { bottom: 15%; left: 15%; animation: orbit-cw 5s linear infinite 1s; }
        @keyframes pulse-glow { 0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; } 100% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; } }
        @keyframes orbit-ccw { 0% { transform: rotate(0deg) translateX(45px) rotate(0deg); } 100% { transform: rotate(-360deg) translateX(45px) rotate(360deg); } }
        @keyframes orbit-cw { 0% { transform: rotate(0deg) translateX(32px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(32px) rotate(-360deg); } }

        /* 2. RAINBOW_SWIPE – unchanged (horizontal sweep fits) */
        .rainbow-swipe {
            position: absolute;
            width: 200%;
            height: 100%;
            top: 0;
            left: -50%;
            background: linear-gradient(90deg, transparent, #ff5e5e, #f9ca24, #7ed6df, #be2edd, transparent);
            animation: swipe 2s linear infinite;
            transform: skewX(-15deg);
            pointer-events: none;
        }
        @keyframes swipe { 0% { left: -50%; } 100% { left: 50%; } }

        /* 3. AURORA – larger oval */
        .aurora { width: 160px; height: 130px; border-radius: 50%; filter: blur(12px); background: conic-gradient(from 0deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb, #ff9a9e); animation: aurora-move 4s ease-in-out infinite alternate; opacity: 0.85; }
        @keyframes aurora-move { 0% { transform: scale(0.9) rotate(0deg); } 100% { transform: scale(1.15) rotate(180deg); } }

        /* 4. COMET – horizontal travel still looks great, no height change needed */
        .comet { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: currentColor; top: 50%; left: 5%; animation: comet-fly 2s linear infinite; box-shadow: 0 0 18px currentColor; pointer-events: none; margin-top: -6px; }
        .comet::before { content: ''; position: absolute; width: 70px; height: 2px; background: linear-gradient(to left, currentColor, transparent); top: 50%; right: 100%; transform: translateY(-50%); }
        @keyframes comet-fly { 0% { transform: translate(-40px, 0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(340px, 0); opacity: 0; } }

        /* 5. CHASING_DOTS – higher bounce */
        .chasing-dots { display: flex; gap: 16px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; animation: chase 0.9s ease-in-out infinite alternate; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }
        @keyframes chase { 0% { transform: translateY(0px) scale(0.8); opacity: 0.3; } 100% { transform: translateY(-30px) scale(1.3); opacity: 1; } }

        /* 6. CYLON – wider bar and thicker glow */
        .cylon { width: 260px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 6px; position: relative; }
        .cylon-bar { position: absolute; width: 50px; height: 100%; border-radius: 6px; background: currentColor; box-shadow: 0 0 25px currentColor; animation: cylon-sweep 1.8s ease-in-out infinite alternate; }
        @keyframes cylon-sweep { 0% { left: 0; } 100% { left: calc(100% - 50px); } }

        /* 7. DUAL_COMET – deeper diagonal paths */
        .dual-comet { position: relative; width: 100%; height: 100%; }
        .comet-1 { position: absolute; top: 10%; left: 5%; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: fly-diagonal 2.2s linear infinite; pointer-events: none; }
        .comet-2 { position: absolute; bottom: 10%; right: 5%; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: fly-diagonal-reverse 2.2s linear infinite 1.1s; pointer-events: none; }
        @keyframes fly-diagonal { 0% { transform: translate(0, 0); opacity:0; } 25% { opacity:1; } 100% { transform: translate(290px, 150px); opacity:0; } }
        @keyframes fly-diagonal-reverse { 0% { transform: translate(0, 0); opacity:0; } 25% { opacity:1; } 100% { transform: translate(-290px, -150px); opacity:0; } }

        /* 8. SPARKLE_SWEEP – larger arc */
        .sparkle-sweep { position: relative; width: 100%; height: 120px; }
        .sparkle-particle { position: absolute; border-radius: 50%; background: #ffffff; box-shadow: 0 0 6px #ffffff, 0 0 14px rgba(255,255,255,0.6); pointer-events: none; animation: sweep-arc 2s ease-in-out infinite; }
        .sparkle-particle:nth-child(1) { width: 10px; height: 10px; animation-delay: 0s; }
        .sparkle-particle:nth-child(2) { width: 8px; height: 8px; animation-delay: 0.14s; }
        .sparkle-particle:nth-child(3) { width: 7px; height: 7px; animation-delay: 0.28s; }
        .sparkle-particle:nth-child(4) { width: 9px; height: 9px; animation-delay: 0.42s; }
        .sparkle-particle:nth-child(5) { width: 6px; height: 6px; animation-delay: 0.56s; }
        .sparkle-particle:nth-child(6) { width: 7px; height: 7px; animation-delay: 0.70s; }
        @keyframes sweep-arc {
            0%   { transform: translate(4px, 110px) scale(0); opacity: 0; }
            12%  { opacity: 1; transform: translate(20px, 70px) scale(1); }
            40%  { transform: translate(140px, 30px) scale(1.4); opacity: 1; }
            70%  { transform: translate(250px, 8px) scale(0.9); opacity: 0.5; }
            100% { transform: translate(310px, -8px) scale(0); opacity: 0; }
        }

        /* 9. POLICE – bigger lights */
        .police { display: flex; gap: 28px; }
        .police-light { width: 22px; height: 22px; border-radius: 50%; background: currentColor; animation: blink 0.5s ease-in-out infinite alternate; box-shadow: 0 0 20px currentColor; }
        .police-light:nth-child(1) { color: #ff4757; animation-delay: 0s; }
        .police-light:nth-child(2) { color: #1e90ff; animation-delay: 0.25s; }
        @keyframes blink { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.3); } }

        /* 10. PLASMA – larger disc */
        .plasma { width: 70px; height: 70px; border-radius: 50%; background: conic-gradient(from 0deg, #ff9a9e, #a18cd1, #fad0c4, #fbc2eb, #ff9a9e); animation: spin-plasma 2s linear infinite; filter: blur(6px); pointer-events: none; }
        @keyframes spin-plasma { 100% { transform: rotate(360deg); } }

        /* 11. RAINBOW_GRADIENT – larger square */
        .rainbow-grad { width: 70px; height: 70px; border-radius: 16px; background: conic-gradient(#ff5e5e, #f9ca24, #7ed6df, #be2edd, #ff5e5e); animation: spin-rainbow 3s linear infinite; pointer-events: none; }
        @keyframes spin-rainbow { 100% { transform: rotate(360deg); } }

        /* 12. PULSE_WAVE – rings start smaller and expand more */
        .pulse-wave { display: flex; align-items: center; justify-content: center; width: 90px; height: 90px; }
        .ring { position: absolute; border: 2px solid currentColor; border-radius: 50%; animation: pulse 2s ease-out infinite; width: 100%; height: 100%; pointer-events: none; }
        .ring:nth-child(2) { animation-delay: 0.6s; }
        .ring:nth-child(3) { animation-delay: 1.2s; }
        @keyframes pulse { 0% { transform: scale(0.2); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }

        /* 13. SINGLE_RUNNER – taller rectangular path */
        .single-runner { width: 24px; height: 24px; border-radius: 50%; background: currentColor; box-shadow: 0 0 22px currentColor; animation: run-rect 1.6s linear infinite; pointer-events: none; }
        @keyframes run-rect {
            0%   { transform: translate(-150px, -80px); }
            25%  { transform: translate(150px, -80px); }
            50%  { transform: translate(150px, 80px); }
            75%  { transform: translate(-150px, 80px); }
            100% { transform: translate(-150px, -80px); }
        }

        /* 14. AUDIO_VISUALIZER – taller bars */
        .audio-viz { display: flex; align-items: flex-end; gap: 8px; height: 110px; }
        .bar { width: 8px; height: 100%; background: currentColor; border-radius: 4px; animation: bounce-bar 0.7s ease-in-out infinite alternate; }
        .bar:nth-child(1) { height: 35%; animation-delay: 0.1s; }
        .bar:nth-child(2) { height: 60%; animation-delay: 0.2s; }
        .bar:nth-child(3) { height: 100%; animation-delay: 0.3s; }
        .bar:nth-child(4) { height: 75%; animation-delay: 0.4s; }
        .bar:nth-child(5) { height: 45%; animation-delay: 0.5s; }
        @keyframes bounce-bar { 0% { transform: scaleY(0.6); } 100% { transform: scaleY(1.3); } }

        /* 15. HEARTBEAT – larger SVG */
        .heartbeat-svg { width: 160px; height: 50px; stroke: currentColor; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .heartbeat-line { animation: draw-beat 1.5s ease-in-out infinite; }
        @keyframes draw-beat { 0% { stroke-dashoffset: 200; stroke-dasharray: 200; } 50% { stroke-dashoffset: 0; stroke-dasharray: 200; } 100% { stroke-dashoffset: -200; stroke-dasharray: 200; } }

        /* --- SKIP LINK / FOOTER etc. (unchanged from original) --- */
        .skip-link {
            position: absolute;
            top: -100%;
            left: 0;
            z-index: 100;
            padding: 0.5rem 1rem;
            background: #06b6d4;
            color: #fff;
            font-size: 0.85rem;
            text-decoration: none;
            transition: top 0.2s;
        }
        .skip-link:focus { top: 0; }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .site-footer {
            margin-top: auto;
            position: relative;
            z-index: 2;
            padding: 1.5rem 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            width: 100%;
            max-width: 1000px;
        }

        .card:focus-visible {
            outline: 2px solid #06b6d4;
            outline-offset: 4px;
        }

        .custom-button-wrap {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            margin-top: 2rem;
            margin-bottom: 3rem;
        }

        .custom-button {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            isolation: isolate;
            overflow: visible;
        }

        .custom-button::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0.5;
            background: radial-gradient(circle at center, rgba(167, 139, 250, 0.3) 0%, transparent 70%);
            filter: blur(18px);
            z-index: -1;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .custom-button:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-3px);
            color: rgba(255, 255, 255, 0.9);
        }

        .custom-button:hover::before {
            opacity: 0.9;
            transform: scale(1.2);
            filter: blur(25px);
        }

        .custom-button:active { transform: scale(0.95); }
        .custom-button:focus-visible { outline: 2px solid #06b6d4; outline-offset: 4px; }

        .custom-button[data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .custom-button-icon {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a78bfa;
            width: 28px;
            height: 28px;
        }

        .custom-button-icon::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #a78bfa, #60a5fa, #34d399, #f472b6, #fbbf24, #a78bfa);
            animation: custom-conic-spin 3s linear infinite;
            opacity: 0.5;
            mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
        }

        .custom-button-icon svg {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 6px rgba(167, 139, 250, 0.4));
            overflow: visible;
        }

        .custom-button-icon svg circle:first-child {
            animation: custom-ring-dash 2.5s ease-in-out infinite alternate;
            transform-origin: 12px 12px;
        }

        .custom-button:hover .custom-button-icon::before {
            animation-duration: 1.5s;
            opacity: 0.8;
            filter: drop-shadow(0 0 8px rgba(167, 139, 250, 0.6));
        }

        @keyframes custom-conic-spin { 100% { transform: rotate(360deg); } }
        @keyframes custom-ring-dash {
            0%   { stroke-dashoffset: 0; stroke-opacity: 0.4; }
            100% { stroke-dashoffset: 40; stroke-opacity: 1; }
        }

        /* Modal styles unchanged */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            padding: 1rem;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal {
            width: 100%;
            max-width: 440px;
            background: rgba(26, 25, 38, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(167, 139, 250, 0.05);
            transform: translateY(20px) scale(0.97);
            transition: transform 0.35s ease;
        }
        .modal-overlay.active .modal { transform: translateY(0) scale(1); }

        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; }
        .modal-header h2 { font-size: 1.25rem; font-weight: 700; color: #fff; }
        .modal-close { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 1.5rem; cursor: pointer; }
        .modal-close:hover { color: rgba(255,255,255,0.8); }
        .modal-close:focus-visible { outline: 2px solid #06b6d4; }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 0.6rem; }

        .pattern-toggle { display: flex; gap: 0.35rem; background: rgba(255,255,255,0.04); border-radius: 14px; padding: 0.35rem; border: 1px solid rgba(255,255,255,0.06); }
        .pattern-btn { flex: 1; padding: 0.55rem 0.5rem; border: none; border-radius: 11px; background: transparent; color: rgba(255,255,255,0.45); font-size: 0.85rem; cursor: pointer; }
        .pattern-btn.active { background: rgba(167,139,250,0.2); color: #c4b5fd; }

        .color-pickers { display: flex; flex-direction: column; gap: 0.5rem; }
        .color-picker-row { display: flex; align-items: center; gap: 0.5rem; }
        .color-picker-row input[type="color"] { width: 100%; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); }
        .remove-color { flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.35); font-size: 1.1rem; cursor: pointer; }
        .remove-color:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.25); color: #ef4444; }
        .add-color-btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; border-radius: 10px; border: 1px dashed rgba(255,255,255,0.1); background: transparent; color: rgba(255,255,255,0.4); font-size: 0.8rem; cursor: pointer; }
        .add-color-btn:hover { border-color: rgba(167,139,250,0.3); color: #a78bfa; }

        .brightness-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
        .brightness-value { font-size: 0.85rem; color: rgba(255,255,255,0.6); }
        input[type="range"] { width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); }

        .modal-footer { display: flex; gap: 0.75rem; margin-top: 1.75rem; }
        .modal-footer .btn { flex: 1; padding: 0.7rem 1rem; border-radius: 14px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .btn-secondary { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); }
        .btn-primary { background: linear-gradient(135deg, #8b5cf6, #a78bfa); color: #fff; }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .card {
                height: 180px;
                border-radius: 32px;
            }
            .custom-button { width: 80px; height: 80px; }
            .custom-button-icon { width: 24px; height: 24px; }
            .cylon { width: 85%; }
            .aurora { width: 90%; }
            .heartbeat-svg { width: 90%; }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div class="stars" aria-hidden="true"></div>

    <main id="main-content">
        <div class="page-header">
            <h1 class="page-title">Pixels String</h1>
            <div class="power-toggle on" role="button" tabindex="0" aria-label="Toggle power" id="powerToggle" data-tooltip="Power">
                <svg class="power-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2v8" />
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
                </svg>
            </div>
        </div>

        <div class="grid-container">
            <!-- Effect cards unchanged HTML structure -->
            <div class="card" data-effect="FIREFLIES" data-tooltip="FIREFLIES" style="--glow: #a3ff00;">
                <div class="icon-wrapper fireflies"><div class="firefly-main"></div><div class="firefly-orb"></div><div class="firefly-orb"></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="RAINBOW_SWIPE" data-tooltip="RAINBOW_SWIPE" style="--glow: #a855f7;">
                <div class="icon-wrapper"><div class="rainbow-swipe"></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="AURORA" data-tooltip="AURORA" style="--glow: #ec4899;">
                <div class="icon-wrapper"><div class="aurora"></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="COMET" data-tooltip="COMET" style="--glow: #f59e0b;">
                <div class="icon-wrapper"><div class="comet"></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="CHASING_DOTS" data-tooltip="CHASING_DOTS" style="--glow: #10b981;">
                <div class="icon-wrapper chasing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="CYLON" data-tooltip="CYLON" style="--glow: #06b6d4;">
                <div class="icon-wrapper"><div class="cylon"><div class="cylon-bar"></div></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="DUAL_COMET" data-tooltip="DUAL_COMET" style="--glow: #f97316;">
                <div class="icon-wrapper dual-comet"><div class="comet-1"></div><div class="comet-2"></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="SPARKLE_SWEEP" data-tooltip="SPARKLE_SWEEP" style="--glow: #8b5cf6;">
                <div class="icon-wrapper"><div class="sparkle-sweep"><div class="sparkle-particle"></div><div class="sparkle-particle"></div><div class="sparkle-particle"></div><div class="sparkle-particle"></div><div class="sparkle-particle"></div><div class="sparkle-particle"></div></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="POLICE" data-tooltip="POLICE" style="--glow: #ef4444;">
                <div class="icon-wrapper police"><div class="police-light"></div><div class="police-light"></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="PLASMA" data-tooltip="PLASMA" style="--glow: #14b8a6;">
                <div class="icon-wrapper"><div class="plasma"></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="RAINBOW_GRADIENT" data-tooltip="RAINBOW_GRADIENT" style="--glow: #d946ef;">
                <div class="icon-wrapper"><div class="rainbow-grad"></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="PULSE_WAVE" data-tooltip="PULSE_WAVE" style="--glow: #6366f1;">
                <div class="icon-wrapper pulse-wave"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="SINGLE_RUNNER" data-tooltip="SINGLE_RUNNER" style="--glow: #f43f5e;">
                <div class="icon-wrapper"><div class="single-runner"></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="AUDIO_VISUALIZER" data-tooltip="AUDIO_VISUALIZER" style="--glow: #22d3ee;">
                <div class="icon-wrapper audio-viz"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><div class="variation-toast"></div>
            </div>
            <div class="card" data-effect="HEARTBEAT" data-tooltip="HEARTBEAT" style="--glow: #f472b6;">
                <div class="icon-wrapper">
                    <svg class="heartbeat-svg" viewBox="0 0 80 50"><polyline class="heartbeat-line" points="0,25 16,25 20,40 28,5 36,25 60,25 68,35 76,15 80,15" stroke="currentColor" /></svg>
                </div>
                <div class="variation-toast"></div>
            </div>
        </div>

        <div class="custom-button-wrap">
            <div class="custom-button" id="customButton" role="button" tabindex="0" data-tooltip="Custom Color &amp; Pattern">
                <div class="custom-button-icon">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/></svg>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="customModal">
        <div class="modal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
            <div class="modal-header"><h2 id="modalTitle">Custom Pixels</h2><button class="modal-close" id="modalClose">&times;</button></div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Pattern</label>
                    <div class="pattern-toggle" role="radiogroup">
                        <button class="pattern-btn active" data-pattern="solid" role="radio" aria-checked="true">Solid</button>
                        <button class="pattern-btn" data-pattern="striped" role="radio" aria-checked="false">Striped</button>
                        <button class="pattern-btn" data-pattern="gradient" role="radio" aria-checked="false">Gradient</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Colors</label>
                    <div class="color-pickers" id="colorPickers">
                        <div class="color-picker-row"><input type="color" value="#ff0000"><button class="remove-color" hidden>&times;</button></div>
                    </div>
                    <button class="add-color-btn" id="addColorBtn" hidden>+ Add Color</button>
                </div>
                <div class="form-group">
                    <div class="brightness-header"><label>Brightness</label><span class="brightness-value" id="brightnessValue">255</span></div>
                    <input type="range" id="brightnessSlider" min="0" max="255" value="255">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCancel">Cancel</button>
                <button class="btn btn-primary" id="modalApply">Apply</button>
            </div>
        </div>
    </div>

    <footer class="site-footer"><p>&copy; 2026 Pixels String.</p></footer>

    <script>
        // (All JavaScript from the original remains completely the same; no changes needed)
        document.addEventListener('DOMContentLoaded', () => {
            const powerToggle = document.getElementById('powerToggle');
            async function fetchPowerState() {
                try {
                    const response = await fetch('/api/info');
                    if (response.ok) {
                        const data = await response.json();
                        if (data.power === 'on') {
                            powerToggle.classList.remove('off'); powerToggle.classList.add('on'); powerToggle.setAttribute('aria-label', 'Toggle power off');
                        } else {
                            powerToggle.classList.remove('on'); powerToggle.classList.add('off'); powerToggle.setAttribute('aria-label', 'Toggle power on');
                        }
                    }
                } catch (error) { console.error('Failed to fetch power state:', error); }
            }
            if (powerToggle) {
                fetchPowerState();
                powerToggle.addEventListener('click', async () => {
                    const isOn = powerToggle.classList.contains('on');
                    const newState = isOn ? 'off' : 'on';
                    const apiUrl = `/api/power?state=${newState}`;
                    powerToggle.classList.add('is-loading');
                    try {
                        const response = await fetch(apiUrl);
                        if (response.ok) {
                            if (newState === 'on') { powerToggle.classList.remove('off'); powerToggle.classList.add('on'); powerToggle.setAttribute('aria-label', 'Toggle power off'); }
                            else { powerToggle.classList.remove('on'); powerToggle.classList.add('off'); powerToggle.setAttribute('aria-label', 'Toggle power on'); }
                            powerToggle.classList.add('is-success');
                        } else { powerToggle.classList.add('is-error'); }
                    } catch (error) { powerToggle.classList.add('is-error'); }
                    finally { powerToggle.classList.remove('is-loading'); setTimeout(() => { powerToggle.classList.remove('is-success', 'is-error'); }, 1000); }
                });
                powerToggle.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); powerToggle.click(); } });
            }

            const cards = document.querySelectorAll('.card');
            cards.forEach(card => { card.setAttribute('role', 'button'); card.setAttribute('tabindex', '0'); card.setAttribute('aria-label', `Activate ${(card.dataset.effect || 'effect').replace(/_/g, ' ')} effect`); });
            let lastClickedCard = null;
            const variationMap = new Map();
            function removeFeedback(card) { setTimeout(() => { card.classList.remove('is-success', 'is-error', 'is-loading'); }, 1000); }
            function showVariationToast(card, index) { if (index === 0) return; const toast = card.querySelector('.variation-toast'); if (!toast) return; toast.textContent = index; toast.classList.remove('active'); void toast.offsetWidth; toast.classList.add('active'); }
            cards.forEach(card => {
                const effectName = card.dataset.effect;
                variationMap.set(card, 0);
                card.addEventListener('click', async () => {
                    if (card.classList.contains('is-loading')) return;
                    let apiCallIndex = 0;
                    if (lastClickedCard !== card) { cards.forEach(c => c.classList.remove('active-selected')); card.classList.add('active-selected'); variationMap.set(card, 1); apiCallIndex = 0; lastClickedCard = card; }
                    else { apiCallIndex = variationMap.get(card) || 0; let nextIndex = (apiCallIndex + 1) % 5; variationMap.set(card, nextIndex); }
                    let apiUrl = apiCallIndex === 0 ? `/api/effect?name=${effectName}` : `/api/variation?index=${apiCallIndex}`;
                    showVariationToast(card, apiCallIndex);
                    card.classList.add('is-loading');
                    try {
                        const response = await fetch(apiUrl);
                        if (response.ok) { card.classList.remove('is-loading'); card.classList.add('is-success'); }
                        else { card.classList.remove('is-loading'); card.classList.add('is-error'); }
                    } catch (error) { card.classList.remove('is-loading'); card.classList.add('is-error'); }
                    finally { removeFeedback(card); }
                });
            });

            const customButton = document.getElementById('customButton');
            const customModal = document.getElementById('customModal');
            const modalClose = document.getElementById('modalClose');
            const modalCancel = document.getElementById('modalCancel');
            const modalApply = document.getElementById('modalApply');
            const patternButtons = document.querySelectorAll('.pattern-btn');
            const colorPickersContainer = document.getElementById('colorPickers');
            const addColorBtn = document.getElementById('addColorBtn');
            const brightnessSlider = document.getElementById('brightnessSlider');
            const brightnessValue = document.getElementById('brightnessValue');
            let currentPattern = 'solid';
            patternButtons.forEach(btn => { btn.addEventListener('click', () => { patternButtons.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-checked', 'false'); }); btn.classList.add('active'); btn.setAttribute('aria-checked', 'true'); currentPattern = btn.dataset.pattern; synchronizeColorPickers(); }); });
            function synchronizeColorPickers() { const currentCount = colorPickersContainer.children.length; let targetCount = currentPattern === 'solid' ? 1 : Math.max(2, currentCount); while (colorPickersContainer.children.length < targetCount) addColorPicker(); while (colorPickersContainer.children.length > targetCount) colorPickersContainer.removeChild(colorPickersContainer.lastChild); addColorBtn.hidden = currentPattern === 'solid'; updateRemoveButtons(); }
            function addColorPicker() { const row = document.createElement('div'); row.className = 'color-picker-row'; const index = colorPickersContainer.children.length + 1; row.innerHTML = `<input type="color" value="#ff0000" aria-label="Color ${index}"><button class="remove-color" type="button" aria-label="Remove color">&times;</button>`; const removeBtn = row.querySelector('.remove-color'); removeBtn.addEventListener('click', () => { if (colorPickersContainer.children.length > 2) { row.remove(); updateRemoveButtons(); relabelColorPickers(); } }); colorPickersContainer.appendChild(row); updateRemoveButtons(); relabelColorPickers(); }
            function updateRemoveButtons() { const removeBtns = colorPickersContainer.querySelectorAll('.remove-color'); removeBtns.forEach(btn => { btn.hidden = currentPattern === 'solid' || colorPickersContainer.children.length <= 2; }); }
            function relabelColorPickers() { const inputs = colorPickersContainer.querySelectorAll('input[type="color"]'); inputs.forEach((input, i) => { input.setAttribute('aria-label', `Color ${i + 1}`); }); }
            addColorBtn.addEventListener('click', () => { if (colorPickersContainer.children.length < 10) addColorPicker(); });
            brightnessSlider.addEventListener('input', () => { brightnessValue.textContent = brightnessSlider.value; });
            function openModal() { customModal.classList.add('active'); setTimeout(() => patternButtons[0].focus(), 100); }
            function closeModal() { customModal.classList.remove('active'); }
            customButton.addEventListener('click', openModal);
            customButton.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(); } });
            modalClose.addEventListener('click', closeModal); modalCancel.addEventListener('click', closeModal);
            customModal.addEventListener('click', (e) => { if (e.target === customModal) closeModal(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && customModal.classList.contains('active')) closeModal(); });
            modalApply.addEventListener('click', async () => { if (modalApply.classList.contains('is-loading')) return; const colorInputs = colorPickersContainer.querySelectorAll('input[type="color"]'); const colors = []; colorInputs.forEach(input => colors.push(input.value.substring(1))); const brightness = parseInt(brightnessSlider.value, 10); let url = `/api/pixels/set?pattern=${currentPattern}`; colors.forEach(c => { url += `&color=${c}`; }); if (brightness < 255) url += `&brightness=${brightness}`; modalApply.classList.add('is-loading'); try { const response = await fetch(url); if (response.ok) { modalApply.classList.remove('is-loading'); modalApply.classList.add('is-success'); document.querySelectorAll('.card').forEach(c => c.classList.remove('active-selected')); setTimeout(closeModal, 600); } else { modalApply.classList.remove('is-loading'); modalApply.classList.add('is-error'); } } catch (error) { modalApply.classList.remove('is-loading'); modalApply.classList.add('is-error'); } finally { setTimeout(() => { modalApply.classList.remove('is-success', 'is-error'); }, 1500); } });
        });
    </script>
</body>
</html>
