<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pixels String - A web-based controller for ESP8266/ESP32 LED pixel string effects. Control firefly, rainbow, aurora, comet and other stunning LED animations from your browser.">
    <meta name="keywords" content="LED controller, pixel string, ESP8266, ESP32, LED effects, firefly, rainbow, WLED alternative, NeoPixel">
    <meta name="author" content="Pixels String">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:title" content="Pixels String - LED Effect Controller">
    <meta property="og:description" content="Control stunning LED pixel string effects from your browser.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pixelstring.app">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Pixels String - LED Effect Controller">
    <meta name="twitter:description" content="Control stunning LED pixel string effects from your browser.">

    <title>Pixels String - LED Effect Controller</title>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Pixels String",
        "description": "A web-based controller for ESP8266/ESP32 LED pixel string effects.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        }
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle at 50% 50%, #1a1926, #0a0a10);
            font-family: sans-serif;
            overflow-x: hidden;
            position: relative;
            padding: 2rem;
        }

        /* Starry background */
        .stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            box-shadow:
                10px 20px 1px rgba(255,255,255,0.3), 50px 80px 1px rgba(255,255,255,0.4),
                120px 300px 1px rgba(255,255,255,0.2), 400px 150px 1px rgba(255,255,255,0.5),
                800px 250px 1px rgba(255,255,255,0.3), 100px 600px 1px rgba(255,255,255,0.4),
                500px 800px 1px rgba(255,255,255,0.2), 250px 900px 1px rgba(255,255,255,0.5);
        }

        /* --- PAGE HEADER --- */
        .page-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            margin-bottom: 3rem;
            position: relative;
            z-index: 2;
        }

        .page-title {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, #c084fc 0%, #a78bfa 25%, #60a5fa 50%, #34d399 75%, #a78bfa 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: title-shimmer 6s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 12px rgba(167, 139, 250, 0.3));
        }

        @keyframes title-shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* --- POWER TOGGLE --- */
        .power-toggle {
            margin-top: 1rem;
            padding: 0.5rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .power-toggle .power-icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            color: #10b981;
            transition: color 0.4s ease;
        }

        .power-toggle:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .power-toggle:active {
            transform: scale(0.95);
        }

        .power-toggle:focus-visible {
            outline: 2px solid #06b6d4;
            outline-offset: 4px;
        }

        .power-toggle.off {
            color: #6b7280;
            border-color: rgba(107, 114, 128, 0.15);
            box-shadow: none;
        }

        .power-toggle.off .power-icon {
            color: #6b7280;
        }

        .power-toggle.on {
            border-color: rgba(16, 185, 129, 0.25);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.08), inset 0 0 15px rgba(16, 185, 129, 0.04);
        }

        .power-toggle.is-loading { opacity: 0.6; cursor: wait; }
        .power-toggle.is-success { border-color: rgba(16, 185, 129, 0.5); box-shadow: 0 0 25px rgba(16, 185, 129, 0.2); }
        .power-toggle.is-error { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 25px rgba(239, 68, 68, 0.2); }
        .power-toggle.is-error .power-icon { color: #ef4444; }

        /* --- GRID --- */
        .grid-container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1.5rem;
            max-width: 900px;
            width: 100%;
            justify-items: center;
        }

        @media (max-width: 900px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 600px) {
            body { padding: 1rem; }
            .grid-container { grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
            .control-panel { margin-bottom: 1.5rem; }
            .site-footer { padding: 1rem 0; }
            .page-title { font-size: 1.75rem; }
        }

        /* --- CARD & GLOW --- */
        .card {
            width: 100px;
            height: 100px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            overflow: visible;
            transition: transform 0.2s ease, box-shadow 0.3s ease, border 0.2s ease;
            isolation: isolate; /* Helps with z-index and blurring in some browsers */
        }

        .card:hover { transform: translateY(-5px) scale(1.02); z-index: 10; }
        .card:active { transform: scale(0.95); }

        /* Tooltip */
        [data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Background Glow */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0.5;
            background: radial-gradient(circle at center, var(--glow) 0%, transparent 70%);
            filter: blur(18px);
            z-index: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .card:hover::before {
            opacity: 0.9;
            transform: scale(1.2);
            filter: blur(25px);
        }

        /* Active Selected Border */
        .card.active-selected {
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15), inset 0 0 20px rgba(255, 255, 255, 0.05);
            transform: translateY(-3px);
        }

        /* --- CRITICAL MASK FIX --- */
        .icon-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: var(--glow);
            border-radius: inherit; /* Inherits the 28px radius */
            overflow: hidden;       /* Keeps all animations perfectly inside the button border */
        }

        /* --- API FEEDBACK --- */
        .card.is-loading { opacity: 0.7; cursor: wait; }
        .card.is-success::before { background: radial-gradient(circle at center, #10b981 0%, transparent 70%) !important; filter: blur(25px) !important; opacity: 1 !important; }
        .card.is-error::before { background: radial-gradient(circle at center, #ef4444 0%, transparent 70%) !important; filter: blur(25px) !important; opacity: 1 !important; }

        /* --- TOAST --- */
        .variation-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            font-family: 'Courier New', Courier, monospace;
        }
        .variation-toast.active { animation: toastFade 1.2s forwards; }
        @keyframes toastFade {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        }

        /* --- ICON ANIMATIONS --- */

        /* 1. FIREFLIES (New Elegant Orbiting) */
        .fireflies { position: relative; width: 40px; height: 40px; }
        .firefly-main { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: currentColor; top: 50%; left: 50%; transform: translate(-50%, -50%); filter: blur(2px); box-shadow: 0 0 20px currentColor; animation: pulse-glow 2.5s ease-in-out infinite alternate; }
        .firefly-orb { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
        .firefly-orb:nth-child(2) { top: 0; left: 50%; transform: translateX(-50%); animation: orbit-ccw 4s linear infinite; }
        .firefly-orb:nth-child(3) { bottom: 20%; left: 10%; animation: orbit-cw 5s linear infinite 1s; }
        @keyframes pulse-glow { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; } }
        @keyframes orbit-ccw { 0% { transform: rotate(0deg) translateX(18px) rotate(0deg); } 100% { transform: rotate(-360deg) translateX(18px) rotate(360deg); } }
        @keyframes orbit-cw { 0% { transform: rotate(0deg) translateX(12px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(12px) rotate(-360deg); } }

        /* 2. RAINBOW_SWIPE (Fixed mask) */
        .rainbow-swipe {
            position: absolute;
            width: 200%;
            height: 100%;
            top: 0;
            left: -50%;
            background: linear-gradient(90deg, transparent, #ff5e5e, #f9ca24, #7ed6df, #be2edd, transparent);
            animation: swipe 2s linear infinite;
            transform: skewX(-15deg);
            pointer-events: none;
        }
        @keyframes swipe { 0% { left: -50%; } 100% { left: 50%; } }

        /* 3. AURORA */
        .aurora { width: 80px; height: 60px; border-radius: 50%; filter: blur(10px); background: conic-gradient(from 0deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb, #ff9a9e); animation: aurora-move 4s ease-in-out infinite alternate; opacity: 0.8; }
        @keyframes aurora-move { 0% { transform: scale(0.8) rotate(0deg); } 100% { transform: scale(1.2) rotate(180deg); } }

        /* 4. COMET - Horizontal sweep left to right */
        .comet { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: currentColor; top: 50%; left: 10%; animation: comet-fly 2s linear infinite; box-shadow: 0 0 15px currentColor; pointer-events: none; margin-top: -5px; }
        .comet::before { content: ''; position: absolute; width: 50px; height: 2px; background: linear-gradient(to left, currentColor, transparent); top: 50%; right: 100%; transform: translateY(-50%); }
        @keyframes comet-fly { 0% { transform: translate(-30px, 0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(120px, 0); opacity: 0; } }

        /* 5. CHASING_DOTS */
        .chasing-dots { display: flex; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: chase 0.9s ease-in-out infinite alternate; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }
        @keyframes chase { 0% { transform: translateY(0px) scale(0.8); opacity: 0.3; } 100% { transform: translateY(-15px) scale(1.2); opacity: 1; } }

        /* 6. CYLON */
        .cylon { width: 60px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; position: relative; }
        .cylon-bar { position: absolute; width: 20px; height: 100%; border-radius: 4px; background: currentColor; box-shadow: 0 0 15px currentColor; animation: cylon-sweep 1.5s ease-in-out infinite alternate; }
        @keyframes cylon-sweep { 0% { left: 0; } 100% { left: calc(100% - 20px); } }

        /* 7. DUAL_COMET */
        .dual-comet { position: relative; width: 100%; height: 100%; }
        .comet-1 { position: absolute; top: 20%; left: 10%; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: fly-diagonal 2s linear infinite; pointer-events: none; }
        .comet-2 { position: absolute; bottom: 20%; right: 10%; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: fly-diagonal-reverse 2s linear infinite 1s; pointer-events: none; }
        @keyframes fly-diagonal { 0% { transform: translate(0, 0); opacity:0; } 30% { opacity:1; } 100% { transform: translate(80px, 80px); opacity:0; } }
        @keyframes fly-diagonal-reverse { 0% { transform: translate(0, 0); opacity:0; } 30% { opacity:1; } 100% { transform: translate(-80px, -80px); opacity:0; } }

        /* 8. SPARKLE_SWEEP - Redesigned: sweeping arc of sparkles */
        .sparkle-sweep {
            position: relative;
            width: 44px;
            height: 44px;
        }
        .sparkle-particle {
            position: absolute;
            border-radius: 50%;
            background: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 6px #ffffff, 0 0 14px rgba(255,255,255,0.6);
            pointer-events: none;
            animation: sweep-arc 1.8s ease-in-out infinite;
        }
        .sparkle-particle:nth-child(1) { width: 8px; height: 8px; animation-delay: 0s; }
        .sparkle-particle:nth-child(2) { width: 6px; height: 6px; animation-delay: 0.12s; }
        .sparkle-particle:nth-child(3) { width: 5px; height: 5px; animation-delay: 0.24s; }
        .sparkle-particle:nth-child(4) { width: 4px; height: 4px; animation-delay: 0.36s; }
        .sparkle-particle:nth-child(5) { width: 3px; height: 3px; animation-delay: 0.48s; }
        .sparkle-particle:nth-child(6) { width: 5px; height: 5px; animation-delay: 0.60s; }
        @keyframes sweep-arc {
            0%   { transform: translate(2px, 42px) scale(0); opacity: 0; }
            15%  { opacity: 1; transform: translate(6px, 34px) scale(1); }
            45%  { transform: translate(22px, 14px) scale(1.4); opacity: 1; }
            75%  { transform: translate(36px, 4px) scale(0.9); opacity: 0.5; }
            100% { transform: translate(44px, -2px) scale(0); opacity: 0; }
        }

        /* 9. POLICE */
        .police { display: flex; gap: 12px; }
        .police-light { width: 16px; height: 16px; border-radius: 50%; background: currentColor; animation: blink 0.5s ease-in-out infinite alternate; box-shadow: 0 0 15px currentColor; }
        .police-light:nth-child(1) { color: #ff4757; animation-delay: 0s; }
        .police-light:nth-child(2) { color: #1e90ff; animation-delay: 0.25s; }
        @keyframes blink { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        /* 10. PLASMA */
        .plasma { width: 40px; height: 40px; border-radius: 50%; background: conic-gradient(from 0deg, #ff9a9e, #a18cd1, #fad0c4, #fbc2eb, #ff9a9e); animation: spin-plasma 2s linear infinite; filter: blur(5px); pointer-events: none; }
        @keyframes spin-plasma { 100% { transform: rotate(360deg); } }

        /* 11. RAINBOW_GRADIENT */
        .rainbow-grad { width: 40px; height: 40px; border-radius: 12px; background: conic-gradient(#ff5e5e, #f9ca24, #7ed6df, #be2edd, #ff5e5e); animation: spin-rainbow 3s linear infinite; pointer-events: none; }
        @keyframes spin-rainbow { 100% { transform: rotate(360deg); } }

        /* 12. PULSE_WAVE */
        .pulse-wave { display: flex; align-items: center; justify-content: center; width: 50px; height: 50px; }
        .ring { position: absolute; border: 2px solid currentColor; border-radius: 50%; animation: pulse 2s ease-out infinite; width: 100%; height: 100%; pointer-events: none; }
        .ring:nth-child(2) { animation-delay: 0.6s; }
        .ring:nth-child(3) { animation-delay: 1.2s; }
        @keyframes pulse { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        /* 13. SINGLE_RUNNER */
        .single-runner { width: 20px; height: 20px; border-radius: 50%; background: currentColor; box-shadow: 0 0 15px currentColor; animation: run-square 1.2s linear infinite; pointer-events: none; }
        @keyframes run-square { 0% { transform: translate(-20px, -20px); } 25% { transform: translate(20px, -20px); } 50% { transform: translate(20px, 20px); } 75% { transform: translate(-20px, 20px); } 100% { transform: translate(-20px, -20px); } }

        /* 14. AUDIO_VISUALIZER */
        .audio-viz { display: flex; align-items: flex-end; gap: 4px; height: 40px; }
        .bar { width: 5px; height: 100%; background: currentColor; border-radius: 2px; animation: bounce-bar 0.7s ease-in-out infinite alternate; }
        .bar:nth-child(1) { height: 30%; animation-delay: 0.1s; }
        .bar:nth-child(2) { height: 60%; animation-delay: 0.2s; }
        .bar:nth-child(3) { height: 100%; animation-delay: 0.3s; }
        .bar:nth-child(4) { height: 70%; animation-delay: 0.4s; }
        .bar:nth-child(5) { height: 40%; animation-delay: 0.5s; }
        @keyframes bounce-bar { 0% { transform: scaleY(0.5); } 100% { transform: scaleY(1.2); } }

        /* 15. HEARTBEAT */
        .heartbeat-svg { width: 40px; height: 25px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .heartbeat-line { animation: draw-beat 1.5s ease-in-out infinite; }
        @keyframes draw-beat { 0% { stroke-dashoffset: 100; stroke-dasharray: 100; } 50% { stroke-dashoffset: 0; stroke-dasharray: 100; } 100% { stroke-dashoffset: -100; stroke-dasharray: 100; } }
        /* --- SKIP LINK --- */
        .skip-link {
            position: absolute;
            top: -100%;
            left: 0;
            z-index: 100;
            padding: 0.5rem 1rem;
            background: #06b6d4;
            color: #fff;
            font-size: 0.85rem;
            text-decoration: none;
            transition: top 0.2s;
        }
        .skip-link:focus {
            top: 0;
        }

        /* --- FOOTER --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .site-footer {
            margin-top: auto;
            position: relative;
            z-index: 2;
            padding: 1.5rem 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            width: 100%;
            max-width: 900px;
        }

        /* --- FOCUS VISIBLE --- */
        .card:focus-visible {
            outline: 2px solid #06b6d4;
            outline-offset: 4px;
        }


    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div class="stars" aria-hidden="true"></div>

    <main id="main-content">

    <div class="page-header">
        <h1 class="page-title">Pixels String</h1>

        <div class="power-toggle on" role="button" tabindex="0" aria-label="Toggle power" id="powerToggle" data-tooltip="Power">
            <svg class="power-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2v8" />
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
            </svg>
        </div>
    </div>

    <div class="grid-container">
        <!-- 1. FIREFLIES (New) -->
        <div class="card" data-effect="FIREFLIES" data-tooltip="FIREFLIES" style="--glow: #a3ff00;">
            <div class="icon-wrapper fireflies">
                <div class="firefly-main"></div>
                <div class="firefly-orb"></div>
                <div class="firefly-orb"></div>
            </div>
            <div class="variation-toast"></div>
        </div>

        <!-- 2. RAINBOW_SWIPE -->
        <div class="card" data-effect="RAINBOW_SWIPE" data-tooltip="RAINBOW_SWIPE" style="--glow: #a855f7;">
            <div class="icon-wrapper"><div class="rainbow-swipe"></div></div>
            <div class="variation-toast"></div>
        </div>

        <!-- 3. AURORA -->
        <div class="card" data-effect="AURORA" data-tooltip="AURORA" style="--glow: #ec4899;">
            <div class="icon-wrapper"><div class="aurora"></div></div>
            <div class="variation-toast"></div>
        </div>

        <!-- 4. COMET -->
        <div class="card" data-effect="COMET" data-tooltip="COMET" style="--glow: #f59e0b;">
            <div class="icon-wrapper"><div class="comet"></div></div>
            <div class="variation-toast"></div>
        </div>

        <!-- 5. CHASING_DOTS -->
        <div class="card" data-effect="CHASING_DOTS" data-tooltip="CHASING_DOTS" style="--glow: #10b981;">
            <div class="icon-wrapper chasing-dots">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="variation-toast"></div>
        </div>

        <!-- 6. CYLON -->
        <div class="card" data-effect="CYLON" data-tooltip="CYLON" style="--glow: #06b6d4;">
            <div class="icon-wrapper"><div class="cylon"><div class="cylon-bar"></div></div></div>
            <div class="variation-toast"></div>
        </div>

        <!-- 7. DUAL_COMET -->
        <div class="card" data-effect="DUAL_COMET" data-tooltip="DUAL_COMET" style="--glow: #f97316;">
            <div class="icon-wrapper dual-comet">
                <div class="comet-1"></div><div class="comet-2"></div>
            </div>
            <div class="variation-toast"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- POWER TOGGLE ---
            const powerToggle = document.getElementById('powerToggle');

            // Fetch initial power state from the API
            async function fetchPowerState() {
                try {
                    const response = await fetch('/api/info');
                    if (response.ok) {
                        const data = await response.json();
                        if (data.power === 'on') {
                            powerToggle.classList.remove('off');
                            powerToggle.classList.add('on');
                            powerToggle.setAttribute('aria-label', 'Toggle power off');
                        } else {
                            powerToggle.classList.remove('on');
                            powerToggle.classList.add('off');
                            powerToggle.setAttribute('aria-label', 'Toggle power on');
                        }
                    }
                } catch (error) {
                    console.error('Failed to fetch power state:', error);
                }
            }

            if (powerToggle) {
                fetchPowerState();

                powerToggle.addEventListener('click', async () => {
                    const isOn = powerToggle.classList.contains('on');
                    const newState = isOn ? 'off' : 'on';
                    const apiUrl = `/api/power?state=${newState}`;

                    powerToggle.classList.add('is-loading');

                    try {
                        const response = await fetch(apiUrl);
                        if (response.ok) {
                            if (newState === 'on') {
                                powerToggle.classList.remove('off');
                                powerToggle.classList.add('on');
                                powerToggle.setAttribute('aria-label', 'Toggle power off');
                            } else {
                                powerToggle.classList.remove('on');
                                powerToggle.classList.add('off');
                                powerToggle.setAttribute('aria-label', 'Toggle power on');
                            }
                            console.log(`✅ ${apiUrl}`);
                            powerToggle.classList.add('is-success');
                        } else {
                            console.error(`❌ API Error ${response.status}`);
                            powerToggle.classList.add('is-error');
                        }
                    } catch (error) {
                        console.error(`❌ Network Error: ${error.message}`);
                        powerToggle.classList.add('is-error');
                    } finally {
                        powerToggle.classList.remove('is-loading');
                        setTimeout(() => {
                            powerToggle.classList.remove('is-success', 'is-error');
                        }, 1000);
                    }
                });

                powerToggle.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        powerToggle.click();
                    }
                });
            }

            const cards = document.querySelectorAll('.card');

            // Set ARIA roles for accessibility
            cards.forEach(card => {
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                const effect = card.dataset.effect || 'effect';
                card.setAttribute('aria-label', `Activate ${effect.replace(/_/g, ' ')} effect`);
            });

            let lastClickedCard = null;
            // Maps the NEXT variation index to call (0, 1, 2, 3, 4)
            const variationMap = new Map();

            function removeFeedback(card) {
                setTimeout(() => {
                    card.classList.remove('is-success', 'is-error', 'is-loading');
                }, 1000);
            }

            function showVariationToast(card, index) {
                if (index === 0) return; // No toast for Effect call
                const toast = card.querySelector('.variation-toast');
                if (!toast) return;
                toast.textContent = index;
                toast.classList.remove('active');
                void toast.offsetWidth;
                toast.classList.add('active');
            }

            cards.forEach(card => {
                const effectName = card.dataset.effect;
                // Initialize next click state to 0 (Effect)
                variationMap.set(card, 0);

                card.addEventListener('click', async () => {
                    if (card.classList.contains('is-loading')) return;

                    let apiCallIndex = 0;

                    if (lastClickedCard !== card) {
                        // NEW BUTTON CLICKED
                        cards.forEach(c => c.classList.remove('active-selected'));
                        card.classList.add('active-selected');

                        // Reset state to 0 (Effect) for this card
                        variationMap.set(card, 1); // The next click will be Variation 1
                        apiCallIndex = 0; // This click is Effect
                        lastClickedCard = card;
                    } else {
                        // SAME BUTTON CLICKED
                        apiCallIndex = variationMap.get(card) || 0;

                        // Calculate next state for the *following* click (0->1->2->3->4->0)
                        let nextIndex = (apiCallIndex + 1) % 5;
                        variationMap.set(card, nextIndex);
                    }

                    // Construct API URL (relative, served from same origin)
                    let apiUrl = '';
                    if (apiCallIndex === 0) {
                        apiUrl = `/api/effect?name=${effectName}`;
                    } else {
                        apiUrl = `/api/variation?index=${apiCallIndex}`;
                    }

                    // Show toast only if Index > 0
                    showVariationToast(card, apiCallIndex);

                    card.classList.add('is-loading');

                    try {
                        const response = await fetch(apiUrl);
                        if (response.ok) {
                            card.classList.remove('is-loading');
                            card.classList.add('is-success');
                            console.log(`✅ ${apiUrl}`);
                        } else {
                            card.classList.remove('is-loading');
                            card.classList.add('is-error');
                            console.error(`❌ API Error ${response.status}`);
                        }
                    } catch (error) {
                        card.classList.remove('is-loading');
                        card.classList.add('is-error');
                        console.error(`❌ Network Error: ${error.message}`);
                    } finally {
                        removeFeedback(card);
                    }
                });
            });
        });
    </script>
